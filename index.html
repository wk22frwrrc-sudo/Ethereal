  <footer>生死相依 · BOUND TOGETHER IN LIFE AND DEATH 配樂 · 《長生樹》· 在虛無中永存 · 循環播放</footer>
</div>

<!-- 音乐 -->
<button id="music" type="button" aria-pressed="false" title="《長生樹》· 在虛無中永存">♪</button>
<button id="cue" type="button">點此開啟音樂 🔊</button>

<script>
/* 配樂：網易雲歌曲 ID 3313555607《長生樹》，循環播放；換歌只改下面 id */
var MUSIC_URL = "https://music.163.com/song/media/outer/url?id=3313555607.mp3";
var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
var intro = document.getElementById("intro"), app = document.getElementById("app");
var cue = document.getElementById("cue"), musicBtn = document.getElementById("music");
var lines = document.querySelectorAll(".line"), timers = [];

document.body.style.overflow = "hidden";
function finish(){
  timers.map(clearTimeout);
  lines.forEach(function (l) { l.classList.add("show"); });
  intro.classList.add("gone"); app.classList.add("on");
  document.body.style.overflow = "";
  setTimeout(function () { intro.hidden = true; }, 1600);
}
if (reduce) finish();
else {
  timers.push(setTimeout(function () { lines[0].classList.add("show"); }, 400));
  timers.push(setTimeout(function () { lines[1].classList.add("show"); }, 4000));
  timers.push(setTimeout(finish, 8200));
}

var VIEWS = ["home", "about", "xu", "bing", "nue", "notice"];
var tabs = document.querySelectorAll(".tab");
function go(id){
  VIEWS.forEach(function (v) { document.getElementById(v).hidden = v !== id; });
  tabs.forEach(function (t) { t.setAttribute("aria-current", t.dataset.view === id ? "true" : "false"); });
}
tabs.forEach(function (t) { t.setAttribute("aria-current", "false"); t.addEventListener("click", function () { go(t.dataset.view); play(); }); });
document.querySelectorAll("[data-back]").forEach(function (b) {
  b.addEventListener("click", function () { go("home"); scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }); });
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") go("home"); });

var song = new Audio(MUSIC_URL);
song.loop = true; song.preload = "auto"; song.volume = 0.75;
var on = false;
function mark(s){ on = s; musicBtn.setAttribute("aria-pressed", s ? "true" : "false"); if (s) cue.hidden = true; }
function play(){
  if (on) return;
  var p = song.play();
  if (p && p.then) p.then(function () { mark(true); }, function () { cue.hidden = false; });
  else mark(true);
}
musicBtn.addEventListener("click", function () {
  if (on) { song.pause(); mark(false); } else play();
});
cue.addEventListener("click", play);
document.getElementById("skip").addEventListener("click", function () { finish(); play(); });
document.addEventListener("pointerdown", function (e) {
  if (e.target === musicBtn || e.target === cue) return;
  play();
}, { passive: true });
addEventListener("pagehide", function () { song.pause(); });
play();
</script>
</body>
</html>
