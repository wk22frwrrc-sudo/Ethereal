<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三恋资料</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      background: linear-gradient(180deg, #a8d8ea 0%, #d4e8f0 40%, #e8f4f8 70%, #b8d4e3 100%);
    }

    /* ===== 天空与云 ===== */
    #sky {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 60%;
      z-index: 0;
    }
    .cloud {
      position: absolute;
      background: rgba(255,255,255,0.85);
      border-radius: 50%;
      filter: blur(2px);
      animation: drift linear infinite;
    }
    .cloud::before, .cloud::after {
      content: ''; position: absolute;
      background: inherit; border-radius: 50%;
    }
    .cloud::before {
      width: 60%; height: 120%;
      top: -40%; left: 15%;
    }
    .cloud::after {
      width: 45%; height: 100%;
      top: -20%; right: 15%;
    }
    @keyframes drift {
      from { transform: translateX(-200px); }
      to   { transform: translateX(calc(100vw + 200px)); }
    }

    /* ===== 海洋波纹 ===== */
    .ocean {
      position: fixed; bottom: 0; left: 0;
      width: 100%; height: 35%;
      z-index: 1;
      overflow: hidden;
    }
    .wave {
      position: absolute; bottom: 0; left: -5%;
      width: 110%; height: 100%;
    }
    .wave svg { width: 100%; height: 100%; }

    /* ===== 风铃 ===== */
    .wind-chime {
      position: fixed; top: 10px; right: 20px;
      z-index: 10;
      animation: swing 3s ease-in-out infinite;
      transform-origin: top center;
      cursor: pointer;
    }
    .wind-chime .chime-top {
      width: 40px; height: 6px;
      background: #c9a96e;
      border-radius: 3px;
      margin: 0 auto;
    }
    .wind-chime .chime-string {
      width: 2px; height: 30px;
      background: #c9a96e;
      margin: 0 auto;
    }
    .wind-chime .chime-bell {
      width: 28px; height: 28px;
      background: radial-gradient(circle at 40% 35%, #f5e6c8, #c9a96e);
      border-radius: 50%;
      margin: 0 auto;
      position: relative;
    }
    .wind-chime .chime-bell::after {
      content: '';
      position: absolute; bottom: -8px; left: 50%;
      transform: translateX(-50%);
      width: 2px; height: 12px;
      background: #c9a96e;
    }
    .wind-chime .chime-bell::before {
      content: '';
      position: absolute; bottom: -14px; left: 50%;
      transform: translateX(-50%);
      width: 8px; height: 8px;
      background: #c9a96e;
      border-radius: 50%;
    }
    @keyframes swing {
      0%, 100% { transform: rotate(-5deg); }
      50%      { transform: rotate(5deg); }
    }

    /* ===== 主容器（磨砂玻璃） ===== */
    .container {
      position: relative; z-index: 5;
      max-width: 420px;
      margin: 60px auto 40px;
      padding: 36px 28px 32px;
      background: rgba(255,255,255,0.35);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 8px 32px rgba(100,140,180,0.18);
      text-align: center;
      min-height: 400px;
      display: none;
    }
    .container.active { display: block; }

    /* ===== 首页 ===== */
    .home-title {
      font-size: 1.25em;
      color: #3a5a6e;
      margin-bottom: 18px;
      letter-spacing: 1px;
      line-height: 1.6;
    }
    .home-info {
      font-size: 0.85em;
      color: #6a8a9a;
      margin-bottom: 32px;
      letter-spacing: 2px;
    }
    .home-info span { margin: 0 4px; }

    /* ===== 按钮组 ===== */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }
    .btn {
      width: 70%;
      padding: 12px 0;
      border: none;
      border-radius: 14px;
      background: rgba(255,255,255,0.55);
      color: #3a5a6e;
      font-size: 1em;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s;
      backdrop-filter: blur(6px);
    }
    .btn:hover {
      background: rgba(255,255,255,0.8);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(100,140,180,0.2);
    }
    .btn-row {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-row .btn { width: auto; min-width: 100px; padding: 10px 22px; }

    /* ===== 返回按钮 ===== */
    .back-btn {
      margin-top: 28px;
      padding: 8px 24px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.3);
      color: #6a8a9a;
      font-size: 0.85em;
      cursor: pointer;
      transition: all 0.3s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.55); }

    /* ===== 弹窗遮罩 ===== */
    .modal-overlay {
      position: fixed; inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active { display: flex; }

    .modal-box {
      max-width: 380px;
      width: 90%;
      max-height: 75vh;
      overflow-y: auto;
      padding: 28px 24px;
      background: rgba(255,255,255,0.88);
      border-radius: 20px;
      text-align: left;
      position: relative;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    }
    .modal-box::-webkit-scrollbar { width: 4px; }
    .modal-box::-webkit-scrollbar-thumb { background: #c9d6df; border-radius: 4px; }

    .modal-close {
      position: absolute; top: 12px; right: 16px;
      background: none; border: none;
      font-size: 1.4em; color: #9ab;
      cursor: pointer;
    }
    .modal-title {
      font-size: 1.1em;
      color: #3a5a6e;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(100,140,180,0.2);
    }
    .modal-content {
      font-size: 0.9em;
      color: #4a6a7a;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    /* ===== 提示弹窗 ===== */
    .toast-overlay {
      position: fixed; inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.3);
      display: none;
      justify-content: center;
      align-items: center;
    }
    .toast-overlay.active { display: flex; }
    .toast-box {
      padding: 24px 36px;
      background: rgba(255,255,255,0.92);
      border-radius: 16px;
      font-size: 1em;
      color: #3a5a6e;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      text-align: center;
    }
  </style>
</head>

    <h2 style="font-size:1.15em;color:#3a5a6e;margin-bottom:24px;">虚恋</h2>

  </div>

  <!-- ===== 病恋页 ===== -->

    <h2 style="font-size:1.15em;color:#3a5a6e;margin-bottom:24px;">病恋</h2>
    <div class="btn-group">
      <button class="btn" onclick="openModal('binglian_style')">风格</button>
      <button class="btn" onclick="openModal('binglian_huashu')">话术</button>

  </div>

  <!-- ===== 须知页 ===== -->
  <div class="container" id="xuzhi">
    <h2 style="font-size:1.15em;color:#3a5a6e;margin-bottom:24px;">须知</h2>

      <button class="btn" onclick="openModal('xuzhi_content')">查看须知</button>

  <!-- ===== 弹窗 ===== -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <!-- ===== 提示弹窗 ===== -->
  <div class="toast-overlay" id="toast-overlay" onclick="closeToast()">
    <div class="toast-box" id="toast-box"></div>
  </div>

    // ===== 页面切换 =====

      document.querySelectorAll('.container').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // ===== "不要" 提示 =====
    function showReject() {
      const toast = document.getElementById('toast-overlay');
      document.getElementById('toast-box').textContent = '希望下次你能来了解我';
      toast.classList.add('active');
      setTimeout(() => {
        closeToast();
        showPage('home');
      }, 1800);

      document.getElementById('toast-overlay').classList.remove('active');
